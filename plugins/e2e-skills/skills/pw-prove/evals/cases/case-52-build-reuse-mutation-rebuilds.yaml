id: case-52-build-reuse-mutation-rebuilds
shape: behavior
step: 'Step 3 › build reuse and Step 7 › Mutation check — artifact isolation'
title: 'A reused build satisfies the Step-3 gate, and the mutation verb rebuilds rather than inheriting it'
description: 'Should accept the Step-3 reuse as a legitimate pass — the artifact was built from this exact commit and working tree, the run said so with its reason, and the gate is satisfied by `BUILD=reused` exactly as by `BUILD=ok`. Should NOT force a rebuild to feel safe, and should NOT treat the instant build phase as a skipped or failed build. At Step 7 the reuse that was correct at Step 3 becomes a false green — the proof target is a build, and a mutated source file changes nothing in the standing artifact, so a mutation run against it is green by construction. `proof-run.mjs mutate` is what closes that: it forces the rebuild, stops the preview server by the recorded PID, starts it again with the serve command it is given, and proves the restart before any verdict is read. So the answer must invoke that verb and pass the four things only the agent knows — `--build-command`, `--server-pid`, `--server-log`, `--serve-command` — rather than assembling the rebuild and the restart itself; there is no `BUILD_REUSE=never` on the command line and no `--output` flag, because the forced-no-reuse build and the isolated output directory are fixed by construction. Should say the mutation run leaves `test-results/` untouched, so the clips it is about to deliver survive. Should say the revert is the verb''s, unconditional, and that it marks the artifact stale rather than rebuilding on the spot — the rebuild is lazy, paid by whichever later step next needs the server, and Step 8 hygiene stops a stale server rather than rebuilding it.'
tag: functional_test
input:
    prompt: Load the `pw-prove` skill with the Skill tool and follow it. PR-mode, second proof of the
        afternoon against the same PR in the same worktree — nothing has been touched since the first
        run finished. Step 3's build phase prints `BUILD=reused`, `BUILD_REUSE=hit`, `BUILD_REUSE_REASON=commit-and-tree-unchanged`
        and finishes instantly. Later, at Step 7, the audit and filming runs have both passed and you
        mutate one line of the changed component to check that the spec guards it. What do you do at
        each point?
