id: case-61-serial-in-the-spec
shape: behavior
step: 'Step 5 › Generate — serialisation belongs in the spec, not the command line'
title: 'Serialisation belongs in the spec''s describe block, not on the proof command line'
description: 'The premise is a DECLARED CARVE-OUT, so the hermetic answer is already spent: mocking both sides would make the mock the thing that makes the cross-view assertion pass, which is why the prompt states it is unavailable. Should therefore serialise those scenarios in the spec with `test.describe.configure({ mode: ''serial'' })` around the describe block that owns them, with a comment naming the shared record as the reason, and leave the rest of the proof running concurrently. Should say why the flag is the wrong place: each test already gets a fresh browser context, so nothing leaks that way — what interferes is two scenarios contending for one record, which is a property of THIS spec, and a global --workers=1 would charge every other proof wall clock for it. Should not reach for --workers=1, retries, waits or sleeps to paper over the race.'
tag: functional_test
input:
    prompt: |-
        Load the `pw-prove` skill with the Skill tool and follow it. Step 5, PR-mode.

        The AC under proof is that a job rename PERSISTS ACROSS VIEWS, so the real round-trip is itself the behaviour under proof. You have already declared it as a carve-out (`// CARVE-OUT:`) against ONE pre-existing job record on a shared staging tenant — nothing is created, and the restore call is exercised in the spec. Mocking both sides is therefore off the table and settled: a fixtured response is exactly what would make the cross-view assertion pass, so it would prove nothing. Do not re-open that decision.

        Two of your five scenarios touch that one record — one renames it, the other asserts the rename in a list view. Run concurrently they race each other. How do you handle it?
