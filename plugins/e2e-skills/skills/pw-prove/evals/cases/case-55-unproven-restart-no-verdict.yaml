id: case-55-unproven-restart-no-verdict
shape: behavior
step: 'Step 7 › Mutation check — exit 11 is an unproven restart, and it has no verdict to read'
title: 'An unproven restart means the failure is evidence about a stale server, not a mutation RED'
description: 'Should refuse to read that failure as the mutation check''s RED. Exit 11 says the restart could not be proven — the stop was not confirmed, or nothing announced past the mark the verb took before it — so whatever answers on the port may be the PREVIOUS server holding the pre-mutation artifact, and a failure against it is evidence about a stale server rather than about whether the spec guards the change. Should say there is NO verdict to read at all. Should kill whatever holds the port — the previous preview server, which did not die — and invoke the mutate verb again, letting the verb do the rebuild, the stop and the restart proof rather than assembling any of them by hand. Should note that the artifact is marked stale by this exit, so `audit` and `film` will refuse with exit 15 until the marker is cleared by the exact commands the refusal prints, and that a further `mutate` needs no clearing because it forces a rebuild by construction. Should NOT record RED, NOT report ''the spec guards the change'', NOT read the summary''s signature as a verdict, and NOT treat the 128s loading splash as a slow application to be waited out with a longer timeout.'
tag: functional_test
input:
    prompt: |-
        Load the `pw-prove` skill with the Skill tool and follow it. Step 7, PR-mode. You mutated one line of the changed component and invoked `proof-run.mjs mutate` with the build command, the recorded server PID, the preview task's log and the serve command. It came back **exit 11**, and its summary reports `server.restart: "unproven"` and `artifact: "stale"`, quoting the server's own line:

        ```
        Error: listen EADDRINUSE: address already in use :::36495
        ```

        http://localhost:36495 answers 200, and the summary's `signature` names the guarding test failing after 128s with the page stuck on its loading splash. What do you do?
