id: case-28-hermetic-audit-not-hand-parsed
shape: behavior
step: 'Step 7 › Hermetic audit (on the audit run, before anything is filmed)'
title: 'The hermetic classification is read from the audit summary, never re-run and never hand-parsed'
description: 'The audit verb already classified the run — the phase runs on a green run, over the run''s own traces, once per spec in the set. So the answer must READ `phases.hermetic` from the audit summary: it must not invoke a classifier itself (no `hermetic.mjs` command of its own) and it must not write an ad-hoc node script to parse trace.zip / *.network files. The verdict is still the agent''s. It must treat `in_spec_round_trips` — the spec''s `route.fetch()` call sites — as live traffic requiring a declared carve-out even though those requests appear under MOCKED in the trace, because a trace records the browser and not the Playwright process, and they are deliberately absent from `undeclared` (a source line is not a URL). It must read the `undeclared` list as the mechanical half only, and say that an undeclared live call FAILS the run even though it is green — mock it, or declare the carve-out when the real round-trip IS the AC, and re-run the audit verb. It must also say that legitimacy is its own judgement: a call that IS declared still has to be accepted or rejected against the AC.'
tag: functional_test
input:
    prompt: Load the `pw-prove` skill with the Skill tool and follow it. Step 7's audit run passed —
        `proof-run.mjs audit` exited 0 over the spec set and its JSON summary line is in front of you.
        `phases.hermetic` reports a status of ok, one entry under `live` (the auth bootstrap `POST /api/auth/session`),
        the section GET under `mocked`, one entry under `in_spec_round_trips` naming tests/e2e/checkout.spec.ts,
        an empty `undeclared`, and one entry under `carve_outs` — the spec header's single CARVE-OUT for
        the live auth bootstrap. The spec mocks the section GET by patching it in flight (`const response
        = await route.fetch()` then `route.fulfill`). Nothing has been filmed yet. Reach the hermetic
        verdict and say what happens next.
