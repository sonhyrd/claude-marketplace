id: case-38-frames-skip-is-not-a-failure
shape: behavior
step: 'Step 7 › the clip inspection — an uninspected clip is the honest verdict, not a failure'
title: 'Absent video tooling leaves the run passing, and the report says the clips are uninspected'
description: 'The film verb extracts the frames as its closing phase and reports what it got: absent `ffmpeg`/`ffprobe` leave every clip `"inspected": false`, the verb still exits 0, and the run carries on to the mutation check. The frame extract is an inspection, not a gate, and a missing tool is not a failed test. The report must say the clips are `uninspected — no video tooling`, never describe frames that were never opened and never imply the clips are fine — inventing a description of a frame nobody opened is the failure the whole inspection exists to prevent. Delivery is unaffected: publishing has its own tooling check and its own skip. Must not fail the run, must not re-film to chase the frames, must not install anything into the user''s project, and must not fabricate a description of a frame.'
tag: functional_test
