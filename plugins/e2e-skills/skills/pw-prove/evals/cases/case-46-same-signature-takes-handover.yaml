id: case-46-same-signature-takes-handover
shape: behavior
step: 'Step 7 › Failure handling — exit 7 is the loop ending, and the handover stop is taken'
title: 'An unchanged failure signature ends the fix loop and takes the debugger handover'
description: 'Should read exit 7 as the loop ENDING rather than as a failure to diagnose harder, and stop immediately rather than spending the remaining attempt: the verb records and persists each attempt''s failure signature and exits 7 on the attempt that repeats an unchanged one, so the signature (error class TimeoutError + failing locator getByRole(''button'', { name: ''Apply filter'' })) not moving means the edit changed nothing the app can see — a retry, not a fix. The remaining attempt is deliberately unspent, and there is no fourth fix. Should invoke playwright-debugger against playwright-report/ for the diagnosis, then take the handover stop: post a PR comment on #212 with `gh pr comment` carrying the verdict and where it stopped, the spec and POM verbatim, the runner''s failure output verbatim, the playwright-debugger F-code diagnosis plus the fixes already attempted and why they did not move the failure, what was NOT produced, and the one change that would unblock a re-run. Should stop a dev server this run started and sweep test-results/. Should state plainly that nothing is committed and nothing is pushed, because a knowingly-failing spec on the branch is the defect the pipeline prevents, and should emit no Proof page / Mutation / Committed / Pushed lines.'
tag: functional_test
input:
