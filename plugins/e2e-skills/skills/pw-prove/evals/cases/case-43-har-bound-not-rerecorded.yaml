id: case-43-har-bound-not-rerecorded
shape: behavior
step: 'Step 7 › Verify — item 1, the HAR bind is a phase of the audit verb (Step 5 › HAR-first mocking)'
title: 'A HAR that matches nothing is bound through the audit verb, not re-recorded'
description: 'Should diagnose the binding, not the recording: the committed HAR is canonical (origin `http://localhost`, no port) with every secret placeheld, and Playwright''s HAR lookup matches on exact request-URL string equality, so an unbound HAR matches nothing. EVERY read aborting is the signature — it means the audit verb was invoked without `--har`, or with an `--origin` that is not the origin this run proved, not that the recording is short. The fix is to invoke `proof-run.mjs audit` again WITH `--har e2e/reports.api.har --origin http://localhost:5199`: the bind is a phase of that verb, it runs before any browser run is spent, and there is no documented raw fallback for it — the answer must not run `har-scrub.mjs bind` by hand. The bound copy''s path is the summary''s `phases.har_bind.out`, and it is that path — never a reconstructed one — that travels inline as `PW_PROVE_HAR` on the film and mutate verbs, which have no bind phase of their own. Should read exit 5 with `phases.har_bind.reason` of `unbound-placeholder` as a placeholder sitting in the replay match key (supply a bindings file with `--bindings`, or re-record — never run the proof past it and let it surface as an aborted call) and `committable-output` as a project that un-ignores `.pw-prove/`. Should NOT re-record the HAR, should NOT add hand-mocks for the reads, and should NOT relax notFound:''abort'' or widen to a live call.'
tag: functional_test
input:
    prompt: 'Load the `pw-prove` skill with the Skill tool and follow it. You are at Step 7 in the project
