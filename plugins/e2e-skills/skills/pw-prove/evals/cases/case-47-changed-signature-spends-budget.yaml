id: case-47-changed-signature-spends-budget
shape: behavior
step: 'Step 7 › Failure handling — a moved signature is a converging run'
title: 'A changed failure signature means the run is converging, so the last attempt is spent'
description: 'Should continue the fix loop and use the third attempt: the failure signature changed on both axes (error class TimeoutError -> assertion failure, and a different failing locator), so each fix moved the failure and the run is converging. Should fix the assertion''s expected value for attempt 3 and rerun only the failing test — through the SAME `proof-run.mjs audit` verb with `--grep "<title>"` added, never a raw runner call, because the attempt bound and the signature comparison only see the attempts that go through the verb. Should run the full spec set once after the last fix as the gate: the same command with `--grep` dropped. Should NOT invoke the no-progress checkpoint, should NOT take the handover stop, and should NOT post a PR comment or a stop report while an attempt remains and the failure is still changing.'
tag: functional_test
input:
