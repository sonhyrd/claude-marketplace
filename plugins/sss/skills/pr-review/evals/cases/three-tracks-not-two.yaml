id: three-tracks-not-two
title: Three concurrent tracks, overriding matt:code-review's two
description: |
  Step 2. The skill loads matt:code-review inline and then sends one message with
  three agent calls — its two axes plus OCR — so all three run concurrently at the
  same depth. This is the one instruction pr-review overrides in a skill it does
  not own.

input:
  prompt: |
    Before you kick off the review on PR #128: how many review agents are you
    spawning and what does each do? I was under the impression matt:code-review
    only runs two.

expect:
  must_contain:
    - "OCR"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["OCR"]
        any: ["three", "3 "]
    - output_contains:
        all: ["Standards", "Spec"]
    - output_contains:
        any: ["concurrent", "parallel", "one message", "same message", "at once"]
  failure:
    - output_contains:
        any: ["only two agents", "two tracks in total"]
