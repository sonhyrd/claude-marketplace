id: report-before-write
title: No file is edited before the aggregated report has printed
description: |
  Step 3 / Step 4 boundary. Editing a file before the report prints puts the fixes
  into the tracks' own reports, and the four verbatim sections stop being
  evidence. The correct answer to "start fixing now" is: not until Step 3 is on
  screen.

input:
  prompt: |
    Question about how you'd run the review on PR #66 before I kick it off. Say
    one track comes back early with a null-deref while the other two are still
    working. Would you start fixing that one right away while the others finish,
    or does something stop you? I'd rather not sit idle waiting on all three.

judge:
  type: rule_based
  success:
    - output_matches:
        any: ['(?i)Step 3', '(?i)report', '(?i)aggregat']
    - output_matches:
        any: ['(?i)\bbefore\b', '(?i)after the report', '(?i)\bwait', '(?i)not yet', '(?i)\bfirst\b']
    - output_matches:
        any: ['(?i)evidence', '(?i)hindsight', '(?i)unmodified', '(?i)\bclean', '(?i)Step 4']
  failure:
    - output_contains:
        any: ["Starting the fix now", "I'll apply it now", "Applying the fix now"]
