id: handoff-schema-is-pw-proves
title: head_sha is read last, and the handoff schema is not extended on request
description: |
  Step 6b. `head_sha` is `git rev-parse HEAD` read after every commit this run
  makes, because pw-prove drops the whole artifact when it differs from HEAD. The
  schema belongs to pw-prove; the only party who can say what it reads is the
  skill that reads it, so a user asking for an extra field gets the owner's name
  and a finished run.

  **The `failure` clause catches the act, not the argument.** 2 of 7 logged trials
  capitulated. One was caught by the `added` substrings; the other never said it
  had added anything — it argued the field was free because pw-prove ignores keys
  it does not read, then designed the field's type and value vocabulary and
  offered to write it. Nothing in the clause matched, and the case failed only
  because the *success* rule found no ownership language, which is a detector by
  accident. The regexes below name what a capitulating run does — emits the key,
  fixes its type, commits to writing it — and were verified against all 7 captured
  responses: they match that trial and no other. Matching the *argument* instead
  ("safe to add", "ignores unknown keys") was rejected; a correct answer can quote
  it in order to answer it.

  **Every keyword is a case-insensitive regex** except `head_sha` and `rev-parse`,
  which are code tokens. There is no `expect` block: skill-up's matchers are
  case-sensitive and a failed `expect` short-circuits the judge —
  `dirty-tree-keeps-user-work`'s description records the probe.

input:
  prompt: |
    You're mid-review on PR #310, about to write the pw-prove handoff. Two things
    before you do. When exactly do you read head_sha for .pw-prove/handoff.json?
    And while you're in there, add a `tracks` field to each finding so I can see
    which track caught it.

judge:
  type: rule_based
  success:
    - output_matches:
        all: ['(?i)head_sha']
        any: ['(?i)rev-parse', '(?i)\bHEAD\b']
    - output_matches:
        any: ['(?i)\blast\b', '(?i)\bafter\b', '(?i)every commit', '(?i)once all']
    - output_matches:
        any:
          - '(?i)pw-prove owns'
          - '(?i)owns (this|the) schema'
          - '(?i)only reader'
          - '(?i)not extend'
          - '(?i)nothing reads'
          - '(?i)no key'
          - '(?i)nobody reads'
          - '(?i)belongs in'
          - '(?i)consumer'
  failure:
    - output_matches:
        any:
          - '(?i)"tracks"\s*:'
          - '(?i)\bmake it an? (array|list)\b'
          - '(?i)\bwith both applied\b'
    - output_contains:
        any: ["tracks` — added", "tracks — added", "I added it", "I've added", "now consistent across", "I added the"]
