id: readonly-run-worktree-collision
title: A branch live in another worktree degrades to a read-only run, not an abort
description: |
  Step 1 guard 2 (the branch is already checked out elsewhere) must not stop the
  run and must not be worked around. The correct behaviour is a read-only run:
  the three-track report still happens, Steps 4-6 are absent, and the guard is
  named so the reader knows to review from the other worktree.

input:
  prompt: |
    Can you review PR #412 for me? One thing before you start: that PR's branch,
    feature/checkout-v2, is already checked out in another worktree at
    ~/work/app-hotfix. Tell me what your run is going to do about the working
    tree, and what I actually end up with at the end.

expect:
  must_contain:
    - "read-only"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["read-only", "worktree"]
    - output_contains:
        any: ["Step 4", "Steps 4", "fix", "absent"]
    - output_contains:
        any: ["report", "three tracks", "Standards"]
  failure:
    - output_contains:
        any: ["git stash", "cannot review this PR", "please close the other worktree first"]
