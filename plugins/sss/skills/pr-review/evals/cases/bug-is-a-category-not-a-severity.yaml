id: bug-is-a-category-not-a-severity
title: A `medium` OCR finding categorised `bug` stays Medium and is applied
description: |
  Step 4a. `bug` is OCR's `category` enum, not a severity, and OCR's severity is
  read verbatim and never re-graded. The deleted rule ("any track calling it a bug
  → Critical") collided with that on every `medium·bug` finding — hit in 4 of 7
  logged runs, producing hybrids like `medium·bug` and one agent writing "Real
  bug, but Medium by policy."

  The `failure` rules are **regexes over the grading sentence**, not substrings,
  and they must stay that way. Substring keys failed correct answers twice: a bare
  `Critical` or `promote` matched prose explaining what the run is *not* doing
  ("don't promote it to Critical"), and `is Critical` matched "OCR's apply
  threshold is Critical/High/Medium". The regexes require a *subject* — `O6` or
  "the finding" — next to the grading verb, which is what a wrong answer has and a
  correct one does not. Verified against three correct answers (no match) and five
  wrong phrasings (all matched).

input:
  prompt: |
    Fix stage on PR #377. The OCR track returned O6 with `severity: medium,
    category: bug` — an off-by-one in the pagination offset. What severity does it
    carry in my report and in the handoff, and do you fix it now?

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["Medium"]
        any: ["applied", "apply", "fix it", "fixing it"]
    - output_contains:
        any: ["category", "not a severity", "verbatim", "as reported", "never re-graded", "OCR's severity"]
  failure:
    - output_matches:
        any:
          - '(?i)(O6|this finding|the finding)[^.\n]{0,60}\b(is|becomes|graded|promoted to|bumped to|escalated to)\b[^.\n]{0,30}Critical'
          - '(?i)treat(ed|ing)? (O6|the finding|this finding) as Critical'
    - output_contains:
        any: ["O6 is described", "describe O6", "out of policy", "Real bug, but Medium"]
