id: review-lands-on-the-pr
title: A run against a PR ends with the report posted to the PR, not only in chat
description: |
  Step 4f. The review publishes itself: when Step 1 resolved a PR number, the run
  ends its fix stage by pushing the fix commit and posting the aggregated report
  as one `gh pr comment` on that PR. The old policy line — "Report in chat.
  Posting to GitHub is a separate ask." — is what this case exists to catch
  coming back: it resolved to *nothing happens*, leaving the report visible only
  in the invoker's terminal and the fixes only in a local commit. The wrong
  answer here is inviting, because it is polite and it is what the skill used to
  say: offer to post if the user asks for it.

input:
  prompt: |
    Before I kick off a review on PR #128 — I want the findings where my
    co-author can read them, and she doesn't have my terminal. Do I need to
    copy the report out of the scrollback and paste it into the PR myself
    afterwards, or ask you separately to post it? Also the fix commit: is that
    going to sit local until I push it by hand?

judge:
  type: rule_based
  success:
    - output_matches:
        any:
          - '(?i)gh pr comment'
          - '(?i)post(s|ed|ing)? (it |the report |the review )?(as |to )?(a )?comment'
          - '(?i)comment on the PR'
          - '(?i)posted to the PR'
          - '(?i)lands? on the PR'
    - output_matches:
        any:
          - '(?i)automatic'
          - '(?i)don''t (have to|need to)'
          - '(?i)do not (have to|need to)'
          - '(?i)no need to'
          - '(?i)without asking'
          - '(?i)not a separate ask'
          - '(?i)on its own'
    # The push has to be described as something the run does, not merely
    # mentioned: "you'll need to push it yourself" contains the word too, and
    # is the exact wrong answer this case exists to catch.
    - output_matches:
        any:
          - "(?i)\\b(i|it|the run|the skill|the fix stage|4e|step 4e)('ll| will| am going to| going to)? push"
          - '(?i)push(es|ed|ing)? (it|them|the fix commit|the branch) for you'
          - '(?i)(automatically push|pushed automatically)'
          - "(?i)(don't|do not|no) need to push"
          - '(?i)Fixes committed and pushed'
  failure:
    - output_contains:
        any:
          - "Posting to GitHub is a separate ask"
          - "posting to GitHub is a separate ask"
          - "you'll need to paste it"
          - "you will need to paste it"
          - "copy it into the PR yourself"
          - "just say the word and I'll post it"
          - "Never push"
          - "the report stays in chat"
          - "push it yourself"
          - "you'll need to push"
          - "you will need to push"
