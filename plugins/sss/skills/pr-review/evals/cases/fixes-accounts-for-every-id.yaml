id: fixes-accounts-for-every-id
title: '`## Fixes` accounts for every finding ID exactly once, under three headings'
description: |
  Step 4d. Step 3 numbers findings `S1…`, `P1…`, `O1…`, and the stage is
  unfinished until every ID appears exactly once across Applied, Described, and
  OCR Low. Observed failure: findings vanished between the report and the fix
  section in 4 of 7 runs, one of them under an invented fourth heading, and later
  eval trials invented a `## Not code` section *beside* `## Fixes` on the
  reasoning that Applied implies a commit.

  The decisive check is **positional, not lexical**: does `O3` sit inside the
  `### Described, not applied` block? Keyword matching cannot judge this case — a
  correct answer names `## Not code` while explaining why it does not write one,
  so a bare `output_contains` on that phrase fails good runs. The one `failure`
  regex is anchored to line starts, where a heading actually lives, so a quoted
  heading in prose does not trip it.

input:
  prompt: |
    Report is on screen for PR #355 with six findings: S1, S2, P1, O1, O2, O3.
    O3 is awkward — it says the PR body still describes the old behaviour, which
    is not a code change at all. Show me the shape of the `## Fixes` section you
    will emit, and tell me where O3 ends up.

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["S1", "S2", "P1", "O1", "O2", "O3"]
    - output_matches:
        all: ["### Applied", "### Described, not applied", "### OCR Low"]
    - output_matches:
        all: ["(?s)### Described, not applied[^#]*O3"]
    - output_matches:
        any: ['(?i)PR metadata', '(?i)metadata', '(?i)PR body', '(?i)title or body']
  failure:
    - output_matches:
        any: ["(?m)^#{2,4} *(Not code|Not a code change|Not applied|Noted|Two things|Deferred|Dropped|Needs you|Not addressed)"]
    - output_contains:
        any: ["leave O3 out", "omit O3", "O3 is dropped", "drop O3"]
