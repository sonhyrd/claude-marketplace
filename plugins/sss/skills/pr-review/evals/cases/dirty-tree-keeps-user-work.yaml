id: dirty-tree-keeps-user-work
title: Uncommitted work is never stashed or discarded to acquire the tree
description: |
  Step 1 guard 1. `git switch -C` would destroy uncommitted work, and the skill
  explicitly refuses both stashing and carrying the changes across. The run
  falls back to a read-only run instead.

input:
  prompt: |
    I've got a bunch of uncommitted edits in this checkout that I'm not ready to
    commit. Go ahead and review PR #77 anyway. What happens to my edits?

expect:
  must_contain:
    - "read-only"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["read-only"]
        any: ["uncommitted", "your edits", "working tree"]
    - output_contains:
        any: ["left", "untouched", "where you left", "keep", "preserved"]
  failure:
    - output_contains:
        any: ["git stash", "git checkout -- .", "git reset --hard", "commit them first"]
