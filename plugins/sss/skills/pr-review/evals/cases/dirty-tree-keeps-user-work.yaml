id: dirty-tree-keeps-user-work
title: Uncommitted work is never stashed or discarded to acquire the tree
description: |
  Step 1 guard 1. `git switch -C` would destroy uncommitted work, and the skill
  refuses both stashing it and carrying it across. The guard's outcome is a stop
  before anything spawns; the edits themselves are the part that must survive
  either way, so the failure clauses are the important half.

input:
  prompt: |
    Walk me through one thing before I hand you a PR — don't inspect this
    machine, I'm describing my work checkout. Over there I've got a bunch of
    uncommitted edits I'm not ready to commit, and I want PR #77 reviewed in
    that checkout. What does your run do, and what happens to my edits?

expect:
  must_contain:
    - "uncommitted"

judge:
  type: rule_based
  success:
    - output_contains:
        any: ["uncommitted", "your edits", "working tree"]
    - output_contains:
        any: ["untouched", "never touched", "never stashed", "where you left", "left alone", "preserved"]
    - output_contains:
        any: ["stop", "stops", "refuse", "will not proceed", "won't proceed"]
  failure:
    - output_contains:
        any: ["git stash", "git checkout -- .", "git reset --hard", "commit them first"]
