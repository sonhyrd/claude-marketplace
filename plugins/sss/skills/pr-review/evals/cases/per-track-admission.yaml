id: per-track-admission
title: Admission is per track — a contained smell and an OCR Medium land, scope creep does not
description: |
  Step 4c. Severity does not decide admission. A Standards baseline smell whose
  fix is contained in one hunk is applied, an OCR `medium` is applied, and a Spec
  scope-creep finding is described and never applied. The old text said "Medium
  and Low are described, never applied", which excluded the first two.

input:
  prompt: |
    Fix stage on PR #288, three findings to place. S2 is a Standards baseline
    smell — duplicated validation in one function, and the fix is entirely inside
    that hunk. O4 is an OCR finding at `severity: medium` — an unhandled promise
    rejection in the new fetch wrapper. P1 is a Spec finding: the PR adds a
    working CSV export nobody asked for. Which of the three do you edit, and
    which do you only write up?

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["S2", "O4", "P1"]
    - output_matches:
        any: ['(?i)applied', '(?i)\bapply', '(?i)\bedit']
    - output_matches:
        any: ['(?i)scope creep', '(?i)described', '(?i)not applied', '(?i)never applied', '(?i)write up']
  failure:
    - output_contains:
        any: ["Medium and Low are described", "Medium is never applied", "Medium and Low — described", "removed the CSV", "delete the CSV", "deleted the export", "remove the export"]
