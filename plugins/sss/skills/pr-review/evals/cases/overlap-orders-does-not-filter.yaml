id: overlap-orders-does-not-filter
title: A single-track Critical is still applied; overlap only orders the queue
description: |
  Step 4b. Agreement between tracks buys position in the fix queue, not admission
  to it. A Critical only the OCR track caught is applied like any other Critical.

  **`described, not applied` is a regex requiring the finding as subject, not a
  substring.** As a substring it was a false FAIL waiting to fire: `### Described,
  not applied` is a verbatim `## Fixes` heading in `SKILL.md`, so a correct answer
  that shows the section's shape — or names the heading to say this Critical does
  not belong under it — failed the case. The regex wants a placement verb next to
  the heading, which is what a wrong answer has and a correct one does not.

  **Subject and verb are adjacent in that regex, and that is what excludes the
  negated reading.** RE2 has no lookbehind, so "not preceded by a negator" is not
  expressible; requiring `it lands in` with nothing between them is, and it leaves
  no room for the `never` that makes *"it never lands in Described, not applied"* a
  correct answer. Widening the gap back to `[^.\n]{0,40}` reinstates that false
  FAIL — `tests/test_pr_review_eval_rules.py` holds the fixture.

  **Every keyword is a case-insensitive regex** except `Critical`, which is a
  severity token this skill always capitalises. There is no `expect` block:
  skill-up's matchers are case-sensitive and a failed `expect` short-circuits the
  judge — `dirty-tree-keeps-user-work`'s description records the probe.

input:
  prompt: |
    On the PR #201 review, only the OCR track flagged a Critical — an auth token
    written to the logs in plaintext. Standards and Spec both missed it entirely.
    Since only one track caught it, do you skip that fix, and where does it land
    in your fix order?

judge:
  type: rule_based
  success:
    - output_matches:
        all: ['(?i)critical']
    - output_matches:
        any: ['(?i)applied', '(?i)\bapply', '(?i)\bfix', '(?i)don''t skip', '(?i)not skip']
    - output_matches:
        any: ['(?i)\border', '(?i)queue', '(?i)second', '(?i)\bafter\b', '(?i)confidence']
  failure:
    - output_matches:
        any:
          - '(?i)\b(it|this finding|that finding|the critical|the ocr finding|O\d+)\s+(lands?|goes|sits?|belongs?|ends up)\s+(under|in|to)\s+[^.\n]{0,12}described,? not applied'
          - '(?i)\b(is|are|gets?)\s+described,? not applied'
          - '(?i)\bdescribe (it|that|this finding|the critical|the ocr finding)\b[^.\n]{0,40}\b(rather than|instead of|not)\b[^.\n]{0,20}appl'
    - output_contains:
        any: ["skip that fix", "only findings two or more tracks"]
