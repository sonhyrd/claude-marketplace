id: worktree-collision-stops-the-run
title: A branch live in another worktree stops the run and names that worktree
description: |
  Step 1 guard 2 (the branch is already checked out elsewhere). The guard runs
  before the Step 2 fan-out, so the correct behaviour is a named stop: say which
  worktree holds the branch and to re-run from there. It must not be worked
  around, and it must not degrade to a report the fixes can never reach — the
  read-only run was removed for want of a single logged run that used it.

input:
  prompt: |
    Before I hand you PR #412 on my work checkout, walk me through one thing —
    don't inspect this machine, I'm describing that one. Over there, the PR's
    branch feature/checkout-v2 is already checked out in another worktree at
    ~/work/app-hotfix. What does your run do about the working tree in that
    situation, and what do I actually end up with at the end?

expect:
  must_contain:
    - "worktree"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["worktree"]
        any: ["app-hotfix", "~/work/app-hotfix"]
    - output_contains:
        any: ["stop", "stops", "refuse", "will not proceed", "won't proceed"]
    - output_contains:
        any: ["re-run", "rerun", "run it from", "review from", "from that worktree"]
  failure:
    - output_contains:
        any: ["git stash", "read-only", "report anyway", "still get the report", "copy branch", "please close the other worktree first"]
