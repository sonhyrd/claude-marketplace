id: four-tracks-not-two
title: Four concurrent tracks, overriding matt-code-review's two
description: |
  Step 2. The skill loads matt-code-review inline and then sends one message with
  four agent calls — its two axes plus OCR and Complexity — so all four run
  concurrently at the same depth. This is the one instruction pr-review overrides
  in a skill it does not own.

input:
  prompt: |
    Before you kick off the review on PR #128: how many review agents are you
    spawning and what does each do? I was under the impression matt-code-review
    only runs two.

judge:
  type: rule_based
  success:
    - output_matches:
        all: ['(?i)\bOCR\b']
    - output_matches:
        any: ['(?i)ponytail', '(?i)complexity', '(?i)over-engineering']
    - output_matches:
        any: ['(?i)\bfour\b', '\b4\b']
    - output_matches:
        all: ['(?i)Standards', '(?i)Spec']
    - output_matches:
        any:
          - '(?i)concurrent'
          - '(?i)parallel'
          - '(?i)one message'
          - '(?i)same message'
          - '(?i)at once'
  failure:
    - output_contains:
        any: ["only two agents", "two tracks in total", "three tracks in total"]
