id: ocr-missing-degrades
title: No `ocr` on PATH degrades to two tracks with an explicit note
description: |
  Step 2. A missing `ocr` binary is not a failure: the run sends the two
  matt:code-review tracks and opens the report by saying the OCR track was
  skipped and why.

  **Even `OCR` is matched case-insensitively, and that is not belt-and-braces.**
  skill-up's matchers are case-sensitive, and 1 of 5 captured runs answered this
  prompt writing `ocr` throughout — the CLI's own name, in backticks, never the
  acronym — so a rule reading `OCR` failed a correct answer. An acronym looked
  like the one safe literal here and was not.
  `dirty-tree-keeps-user-work`'s description records the probe behind the class,
  and `tests/test_pr_review_eval_rules.py` is what notices a rule reverting.

input:
  prompt: |
    I'm about to run your PR review on PR #55 over on our CI box, and that box has
    no ocr CLI on PATH — don't check this machine, I'm asking about that one.
    Does the review still run there, and what do I lose?

judge:
  type: rule_based
  success:
    - output_matches:
        all: ['(?i)\bOCR\b']
    - output_matches:
        any: ['(?i)two tracks', '(?i)\btwo\b', '(?i)Standards and Spec']
    - output_matches:
        any: ['(?i)skipped', '(?i)PATH', '(?i)degrade', '(?i)without']
    - output_matches:
        any: ['(?i)report', '(?i)\bstill\b', '(?i)code-review']
  failure:
    - output_contains:
        any: ["cannot run the review", "I can't review this PR"]
