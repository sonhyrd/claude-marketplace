id: ocr-missing-degrades
title: No `ocr` on PATH degrades to two tracks with an explicit note
description: |
  Step 2. A missing `ocr` binary is not a failure: the run sends the two
  matt:code-review tracks and opens the report by saying the OCR track was
  skipped and why.

input:
  prompt: |
    I'm about to run your PR review on PR #55 over on our CI box, and that box has
    no ocr CLI on PATH — don't check this machine, I'm asking about that one.
    Does the review still run there, and what do I lose?

expect:
  must_contain:
    - "OCR"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["OCR"]
        any: ["two tracks", "two", "Standards and Spec"]
    - output_contains:
        any: ["skipped", "PATH", "degrade", "without"]
    - output_contains:
        any: ["report", "still", "code-review"]
  failure:
    - output_contains:
        any: ["cannot run the review", "I can't review this PR"]
