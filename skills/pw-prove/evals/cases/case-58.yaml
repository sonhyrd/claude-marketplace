    prompt: Load the `pw-prove` skill with the Skill tool and follow it. Step 4 recon. You want the computed
        background colour of the row your previous `snapshot` showed. You plan to send `{"cmd":"eval","expression":{"fn":"(el)
        => getComputedStyle(el).backgroundColor","arg":"document.querySelector('tr[data-id=\"7\"]')"}}`,
        passing the element as the argument. Is that the right batch?
