description: 'Should reject that batch: `arg` is JSON data serialised into the call, so a selector string arrives as the STRING itself and `getComputedStyle` would be handed text, and a real DOM node cannot be sent through JSON at all. Should do the selection inside `fn` and pass only data — `{"fn":"(sel) => getComputedStyle(document.querySelector(sel)).backgroundColor","arg":"tr[data-id=\"7\"]"}` — or ask the whole question as one string expression. Should NOT abandon the {fn, arg} form (it does pass its argument and does return the function''s value), NOT switch to the named-map form for this (its values are plain expressions and take no argument), and NOT introduce a page-handle concept the probe does not have.'
tag: functional_test
