id: case-4
title: pw-prove - 4
description: 'For /dashboard: detects that no auth setup exists (no storageState in playwright.config.ts, no setup project, no globalSetup, no auth state files) and that the flow requires credentials the agent does not have — must STOP and ask the user for credentials or a seeding command before any navigation to /dashboard. Must not invent credentials, reuse the fixture''s example credentials as if they were real, register a real account, or mutate backend data to reach the target state. For /login: must NOT stop — the login page itself is public (tests/auth.spec.ts line 7 `await loginPage.open()` reaches it with no session), so exploration of /login proceeds normally; requiring credentials to view a public page would be a false positive.'
tag: functional_test
input:
    prompt: You are at Step 3 (Bring-up + Probe) of pw-prove, targeting the protected /dashboard route of the project in evals/files/project-pom/. The project config has no storageState, no setup project, and no globalSetup; there are no seed scripts; no TEST_USER/TEST_PASSWORD-style env vars are set. Existing tests in tests/auth.spec.ts drive the login UI with inline example credentials. Describe exactly how you proceed with exploration for /dashboard, and separately for the public /login route.
context:
    files:
        evals/files/project-pom/playwright.config.ts: evals/files/project-pom/playwright.config.ts
        evals/files/project-pom/src/routes.ts: evals/files/project-pom/src/routes.ts
        evals/files/project-pom/tests/auth.spec.ts: evals/files/project-pom/tests/auth.spec.ts
        evals/files/project-pom/tests/pages/base-page.ts: evals/files/project-pom/tests/pages/base-page.ts
        evals/files/project-pom/tests/pages/login-page.ts: evals/files/project-pom/tests/pages/login-page.ts
constraints: {}
expect: {}
judge:
    type: agent_judge
    model: anthropic/claude-sonnet-4-6
