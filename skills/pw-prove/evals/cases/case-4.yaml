id: case-4
shape: behavior
title: pw-prove - 4
description: 'For /dashboard: detects that no auth setup exists (no storageState in playwright.config.ts, no setup project, no globalSetup, no auth state files) and that the flow requires credentials the agent does not have — must STOP and ask the user for credentials or a seeding command before any navigation to /dashboard. Must not invent credentials, reuse the fixture''s example credentials as if they were real, register a real account, or mutate backend data to reach the target state. For /login: must NOT stop — the login page itself is public (tests/auth.spec.ts line 7 `await loginPage.open()` reaches it with no session), so exploration of /login proceeds normally; requiring credentials to view a public page would be a false positive.'
tag: functional_test
input:
    prompt: Load the `pw-prove` skill with the Skill tool and follow it. You are at Step 3 (Bring-up +
        Probe) of pw-prove, targeting the protected /dashboard route of the project in your current working directory.
        The project config has no storageState, no setup project, and no globalSetup; there are no seed
        scripts; no TEST_USER/TEST_PASSWORD-style env vars are set. Existing tests in tests/auth.spec.ts
        drive the login UI with inline example credentials. Describe exactly how you proceed with exploration
        for /dashboard, and separately for the public /login route.
context:
    repo_fixture: evals/files/project-pom
constraints: {}
