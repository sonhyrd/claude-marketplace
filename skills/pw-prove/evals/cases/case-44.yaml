id: case-44
title: pw-prove - 44
description: 'Should read exit 4 as a CONFIGURATION failure and act on the named key: set NUXT_PUBLIC_AUTH_URL in the environment the build and the preview server will run under (or in the dotenv file they load) and re-run the same two phases. Should recognise that the build never ran, so nothing about the build or the server is yet known, and that a production build does not supply the development defaults that used to hide this. Should NOT re-run the gate unchanged hoping it passes, NOT raise READY_TIMEOUT, NOT start or restart a server, NOT kill a port, and NOT rebuild — every one of those answers a different phase''s failure. Should NOT invent a value for a key it cannot source; where the value is genuinely unknown, it stops and reports the named key rather than guessing one.'
tag: functional_test
input:
    prompt: Step 3, PR-mode against a Nuxt app whose committed .env.example declares `NUXT_PUBLIC_API_BASE=` and `NUXT_PUBLIC_AUTH_URL=` with no values. You allocate port 4173 and run `ENV_CONTRACT=.env.example BUILD_COMMAND='pnpm build' node <skill-base>/scripts/preflight.mjs config build`. It exits 4 within a second, printing `MISSING_KEYS=NUXT_PUBLIC_AUTH_URL`. What do you do?
context: {}
constraints: {}
expect: {}
judge:
    type: rule_based
    success:
        - output_matches:
            all: ["NUXT_PUBLIC_AUTH_URL"]
            any: ["(?i)re-?run", "(?i)run (it|the) (phase|command) again", 'preflight\.mjs config build']
            not: ["(?i)(slow|unresponsive) server", "(?i)wait longer", "(?i)increase the (timeout|budget)"]
    failure:
        - output_contains:
            any: ["rebuild", "exit 5", "SERVE_CAUSE", "poll budget"]
