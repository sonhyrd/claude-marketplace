id: case-51
shape: behavior
title: pw-prove - 51
description: 'Should read SERVE_CAUSE=no-announcement as what it says: the log names no listening origin, so the port could never be read — and the printed crash makes this the server or the built output, not a port that was guessed wrong. Should act on the server''s own error: the preview command is being pointed at an output path that does not exist, so confirm what the build actually produced and start the project''s own preview command against that output. Should NOT hunt for a shifted port, NOT try other loopback forms or other ports, NOT re-run the serve phase on a longer budget, and NOT re-run the build phase, which already passed and whose failure would have been reported as exit 5 with its own standard error.'
tag: functional_test
input:
    prompt: |
        Load the `pw-prove` skill with the Skill tool and follow it. Step 3, PR-mode. The config and build phases passed (`CONFIG=ok`, `BUILD=ok`). You started the preview server and ran the serve phase with SERVER_LOG set. It reported `SERVE=failed`, `SERVE_CAUSE=no-announcement`, `READY=no`, and printed the log's last lines:

        ```
        Error: Cannot find module '/repo/.output/server/index.mjs'
            at Function._resolveFilename (node:internal/modules/cjs/loader:1225:15)
        ```

        What do you do?
