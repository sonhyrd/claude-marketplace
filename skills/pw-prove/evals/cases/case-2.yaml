id: case-2
shape: trigger
title: A "plan the tests for this route" request in a user's words trips the trigger
description: >-
    Trigger case. The prompt is a realistic top-of-task request for a test plan over a POM project —
    scenarios, locators, POM structure, no code yet — and it names no skill. What is graded is whether
    the `description:` frontmatter fired; NOT LOADED is a defect in that frontmatter, recorded as such
    and never repaired by editing this prompt.

    The judge is `skill-loaded.mjs`. Per `evals/prompt-shapes.md` an ACTIVE trigger case asserts
    loading and nothing else, so the twelve content assertions this case carried before #63 are not
    graded here; they survive in `evals/mined-assertions.md` and the registry records them as an
    unmeasured coverage gap against SKILL.md Step 4 -> Scenarios / Locator Mapping Table.

    Its request shape is distinct from the other trigger cases: it asks for a plan and explicitly
    withholds code, which is the coverage-gap-mode approval gate stated the way a user states it.

tag: functional_test
input:
    prompt: Generate a test plan for the /checkout page based on the project structure in evals/files/project-pom/. The project uses POM pattern with BasePage and LoginPage in tests/pages/. The routes file shows /checkout (show + process) and /checkout/confirmation endpoints. Show what scenarios, locators, and POM structure you would create. Do not write code yet — present the plan for approval.
context:
    files:
        evals/files/project-pom/playwright.config.ts: evals/files/project-pom/playwright.config.ts
        evals/files/project-pom/src/routes.ts: evals/files/project-pom/src/routes.ts
        evals/files/project-pom/tests/auth.spec.ts: evals/files/project-pom/tests/auth.spec.ts
        evals/files/project-pom/tests/pages/base-page.ts: evals/files/project-pom/tests/pages/base-page.ts
        evals/files/project-pom/tests/pages/login-page.ts: evals/files/project-pom/tests/pages/login-page.ts
constraints: {}
expect: {}
judge:
    type: script
    script_path: evals/judges/skill-loaded.mjs
    timeout_seconds: 30
