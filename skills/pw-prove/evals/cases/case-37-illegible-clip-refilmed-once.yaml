id: case-37-illegible-clip-refilmed-once
shape: behavior
step: 'Step 7 › the clip inspection — diagnose, fix ungated, re-film once through the verb'
title: 'An illegible clip is diagnosed first, then re-filmed once with a committed fix'
description: 'Should state in the report what each frame shows, clip by clip — that is the inspection, and the film verb already handed the frames over rather than the agent extracting them. Clip 3 is illegible and must be DIAGNOSED before anything is re-filmed: the subject sits against the frame edge, so the diagnosis is element-off-frame and the fix is the ungated `scrollIntoView({ block: ''center'', inline: ''center'' })` at the moment of the hold, in the COMMITTED spec (never in the proof config, never behind PW_PROVE_CLIP — the filming law says the variable may only add time). The re-film is the SAME `proof-run.mjs film` command: the verb re-runs the clip-fidelity audit over the edited spec as its precondition (an edit that moved the dwell can have dropped its `// JUSTIFIED:` marker), clears `test-results/` itself, re-extracts the frames, and counts this run as the re-film — so the answer must not clear the directory or re-run the fidelity audit by hand. Exit 12 means the edit broke the contract; exit 13 means the edit moved the spec set out from under the audit''s network finding, so the audit verb runs again. If the second frame is still illegible the run PUBLISHES it with an explicit warning — `Clip 3 — illegible (element off-frame), published with warning` — rather than stopping: a bad clip is not a failed test. Which attempt this is is READ from the film summary''s `films` / `publish_with_warning`, never recalled. Must not re-film without a preceding fix (deterministic — it reproduces the same frame), must not re-film a second time, and must not fail the run over the clip.'
tag: functional_test
input:
    prompt: 'Load the `pw-prove` skill with the Skill tool and follow it. You are at Step 7. `proof-run.mjs
        film` exited 0 over a three-scenario spec set. Its JSON summary line lists three clips under
        `clips`, each with its measured duration and `"inspected": true` beside the frame the verb extracted,
        and reports `films: 1`, `publish_with_warning: false`. You open the three frames: clips 1 and
        2 show the saved banner centred and settled; clip 3 shows the record list with the success toast
        cut off against the right edge of the frame. Say what you do next.'
