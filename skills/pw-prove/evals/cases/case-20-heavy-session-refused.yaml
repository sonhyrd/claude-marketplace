id: case-20-heavy-session-refused
shape: behavior
step: 'Step 1 › Context gate — a heavy session is refused, not survived'
title: 'A session above the context threshold is refused with its numbers, not survived inline'
description: 'Before anything else in Step 1, measure the session''s context and refuse above 100k tokens. The refusal names the size it measured and the threshold it needs, and gives the exact invocation to paste into a fresh session. Nothing is built, served, checked out, generated or committed. The calling skill''s own confirmation question does not spend this gate — it asked about proceeding, never about where — so a caller cannot continue the run on the user''s behalf; only the user, in their own words, can. Must not continue inline "since the user already said yes", must not self-background or spawn an agent, and must not re-ask.'
