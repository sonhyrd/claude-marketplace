id: case-55
title: pw-prove - 55
description: 'Should refuse to read that failure as the mutation check''s RED. `RESTART=unproven` says the process answering 36495 is not the one just started, so the run under test is the PREVIOUS artifact — a failure against it is evidence about a stale server, not about whether the spec guards the change. Should fix the bring-up first: find and kill whatever is holding 36495 (the previous preview server, which did not die), restart the preview, and re-run the serve phase with SERVE_RESTART=1 and the mark until it reports `RESTART=proven` / `SERVE=ok`. Should then re-run the guarding test and take the verdict from THAT run. Should NOT record RED, NOT report ''the spec guards the change'', NOT proceed to the revert-and-rebuild step, and NOT treat the 128s loading splash as a slow application to be waited out with a longer timeout.'
tag: functional_test
input:
    prompt: |-
        Step 7, PR-mode. You mutated one line, rebuilt with BUILD_REUSE=never, stopped and restarted the preview server, and ran the serve phase with SERVE_RESTART=1 and RESTART_LOG_OFFSET set. It reported `SERVE=failed`, `SERVE_CAUSE=restart-port-in-use`, `RESTART=unproven`, and quoted the server's own line:

        ```
        Error: listen EADDRINUSE: address already in use :::36495
        ```

        http://localhost:36495 answers 200. You run the guarding test anyway and it fails after 128s with the page stuck on its loading splash. What do you do?
context: {}
constraints: {}
expect: {}
judge:
    type: agent_judge
    model: anthropic/claude-sonnet-4-6
