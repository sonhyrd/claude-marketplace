title: 'A webServer that builds and boots the proof target survives the spread, so the proof config keeps it'
description: 'The sibling of case-45, on the other side of the boundary. Should read the second entry as the build-and-boot of the proof target itself — it answers 200 at 4173, which is the origin this run proves — and therefore KEEP the inherited webServer, removing the `webServer: undefined` line from the committed proof config once, in place, and staging it with this run. Should keep the array whole, so the hermetic MSW backend declared beside the origin survives too. Should say why keeping costs nothing: reuseExistingServer adopts the already-running server, so the command never runs. Should decide on what answers at the entry''s url, not on what the entry''s command reads like. Should NOT add or retain `webServer: undefined`, NOT delete the entry, NOT edit the project''s own playwright.config.ts, and NOT start a second server to satisfy the config.'
tag: functional_test
input:
