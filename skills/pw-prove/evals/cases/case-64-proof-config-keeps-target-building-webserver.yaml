        build --mode staging && node .output/server/index.mjs'', url: ''http://127.0.0.1:4173'', reuseExistingServer:
        true }]`. You built the app and started that SSR origin yourself on port 4173, and a curl of
        http://127.0.0.1:4173 returns 200. What do you do before the proof run?'
