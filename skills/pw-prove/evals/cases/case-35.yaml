description: 'Should run the clip-fidelity audit — `node <skill>/scripts/clip-fidelity.mjs spec e2e/reports.spec.ts --config <configPath> --verdict "pinned:1600x900"` — and read its exit code, not just the passing YAGNI/PROVES/e2e-reviewer results. The script exits 2: no test() carries a PW_PROVE_CLIP-gated wait. That BLOCKS Step 7 exactly as a missing PROVES header does — this is the originating regression, where the proof run passed PW_PROVE_CLIP=1 into a spec with no reader, so the flag was inert, the dwell never happened, and every gate stayed green over a recording that showed nothing. The fix is to add the framed, `// JUSTIFIED:`-marked, PW_PROVE_CLIP-gated dwell from code-rules.md §Payoff dwell to each test(), then re-run the audit until it exits 0. Must not proceed to the proof run and must not treat the clean PROVES/YAGNI/e2e-reviewer results as sufficient.'
