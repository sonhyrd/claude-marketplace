id: b05-handoff-stale
title: A stale handoff is deleted and declared, never folded and never dropped silently
description: >-
  B05. `.pw-prove/handoff.json` records a head_sha that no longer matches HEAD, so its
  findings point at line numbers that have moved. The contract is: never use it, never drop
  it silently — delete the file and carry one Assumptions line naming both shas. Folding it
  as current, or saying nothing, are the two regressions.

input:
    prompt: >-
      Step 2 of a PR-mode run on PR #2866. At the repo root you find `.pw-prove/handoff.json`
      containing `{"base":"origin/main","head_sha":"9f1c4ae0b2d34c5e6f708192a3b4c5d6e7f80912","pr":2866,
      "findings":[{"title":"Filter chip does not clear on reset","severity":"High","file":"app/components/PeopleList.vue","line":88,
      "detail":"Clicking Reset leaves the chip rendered."}],"fixes_applied":[]}`.
      `git rev-parse HEAD` returns `c3a77d18e4b5f6071829304a5b6c7d8e9f0a1b2c`. What do you do with
      the handoff, and what appears in the plan?
judge:
    type: script
    script_path: evals/judges/stale-handoff-deleted.mjs
    timeout_seconds: 30
