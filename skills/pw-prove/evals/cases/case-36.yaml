description: 'Should run `clip-fidelity.mjs spec <spec> --config playwright.config.ts --verdict "deliberate:1440x810"`. The script re-derives `deliberate` from the config text — an explicit `viewport:` key is a project decision, and it outranks the `...devices[''Desktop Chrome'']` spread sitting beside it — agrees with the declared verdict, and exits 0. The absent `test.use({ viewport })` is CORRECT here: code-rules.md §Viewport pin says a deliberate viewport is respected and never pinned over, so adding a 1600x900 pin would make the proof run and the mutation check render at a size the project never uses. Should proceed to Step 7 and size the recording (PW_PROVE_W/PW_PROVE_H) to 1440x810, the effective viewport, not to the 1600x900 pin default.'
