id: case-1
shape: trigger
title: pw-prove - 1
description: Should detect POM pattern (tests/pages/ directory with BasePage and LoginPage). Should identify /login as covered via auth.spec.ts. Should identify /dashboard, /dashboard/analytics, /settings, /settings/notifications, /settings/security, /profile, /checkout, /checkout/confirmation as uncovered routes. Should flag auth-related paths as already covered. Should flag /checkout as high priority (form-heavy). Should recommend new tests follow the existing POM pattern with classes extending BasePage.
tag: functional_test
input:
    prompt: Analyze the project in evals/files/project-pom/ and identify coverage gaps. The project has routes defined in src/routes.ts including /login, /dashboard, /dashboard/analytics, /settings, /settings/notifications, /settings/security, /profile, /checkout, and /checkout/confirmation. Currently only auth tests exist in tests/auth.spec.ts. Identify what is covered, what is not, and how new tests should be structured.
context:
    files:
        evals/files/project-pom/playwright.config.ts: evals/files/project-pom/playwright.config.ts
        evals/files/project-pom/src/routes.ts: evals/files/project-pom/src/routes.ts
        evals/files/project-pom/tests/auth.spec.ts: evals/files/project-pom/tests/auth.spec.ts
        evals/files/project-pom/tests/pages/base-page.ts: evals/files/project-pom/tests/pages/base-page.ts
        evals/files/project-pom/tests/pages/login-page.ts: evals/files/project-pom/tests/pages/login-page.ts
constraints: {}
expect: {}
judge:
    type: agent_judge
    model: anthropic/claude-sonnet-4-6
