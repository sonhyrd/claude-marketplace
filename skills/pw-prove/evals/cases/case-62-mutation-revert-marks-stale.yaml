id: case-62-mutation-revert-marks-stale
shape: behavior
step: 'Step 7 › Mutation check — step 4, the revert marks the artifact stale rather than rebuilding'
title: 'After a mutation verdict the revert is immediate and the rebuild is lazy'
description: 'Should revert the source exactly and unconditionally — the tree is never left mutated — then mark the built artifact STALE instead of rebuilding and restarting on the spot. The rebuild is paid by whichever later step next needs the server, which checks the marker first; Step 8 hygiene stops a stale server rather than rebuilding it, so a mutation check that is the run''s last step pays nothing (docs/adr/0020). Should say why a marker is needed at all: the artifact is out of step with a tree the build-reuse check sees as unchanged, because the revert restored it. Should report the artifact state in the completion report''s `Preview server:` line. Must not rebuild unconditionally "so nothing downstream runs against broken software" — that is the retired rule, and the marker closes the same hazard without asking this step to predict whether a later step is coming. `BUILD_REUSE=never` on the mutation''s OWN rebuild is unchanged and stays.'
tag: functional_test
