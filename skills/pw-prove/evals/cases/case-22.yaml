description: 'Should read the explicit `viewport: { width: 1440, height: 900 }` key in the chromium project''s `use` block, classify it as a DELIBERATE project decision, and respect it. Must NOT pin 1600x900 and must not emit a `test.use({ viewport: ... })` override in the spec. The recording size must match the project''s own viewport, passed as `PW_PROVE_W=1440 PW_PROVE_H=900` on the proof command — the proof config file itself stays static with its 1600x900 default untouched, since the size is the one per-run value and it travels on the command line. The dwell and the PW_PROVE_CLIP gating are unchanged by this branch.'
