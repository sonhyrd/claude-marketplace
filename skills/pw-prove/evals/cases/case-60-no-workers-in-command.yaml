id: case-60-no-workers-in-command
shape: behavior
step: 'Step 7 › Verify — the filming run''s command'
title: 'The filming run is the film verb, and it carries no --workers flag; ADR 0017 retired that mandate'
description: 'The filming run is the second of Step 7''s two runs — the audit run precedes it un-clipped — and it is ONE command: `node <skill-base>/scripts/proof-run.mjs film`. The verb clears test-results/ itself, films the resolved spec set with PW_PROVE_CLIP=1 and the effective viewport the `--verdict` declares, and extracts the frames; none of that is assembled on the command line. It carries `--config`, `--test-dir`, `--base`, `--written` (the spec this run wrote, which is what tags the resolved set), `--project-config` and `--verdict`, and `PW_PROVE_HAR` travels inline because the film verb has no bind phase of its own. It passes NO --workers (and no -j) at all: docs/adr/0017 retired the --workers=1 mandate on 31 measured runs, and the verb expresses no worker override by construction, so the scenarios run at Playwright''s default of cores/2. It must not substitute a literal worker count either. It must NOT emit a raw `npx playwright test` invocation for the filming run: there is no raw-runner fallback anywhere in Step 7, because a fallback is a second copy and the second copy is the one that drifts. It must not pin workers in the committed proof config or in the project''s playwright.config.'
tag: functional_test
input:
    prompt: Load the `pw-prove` skill with the Skill tool and follow it. Step 7, PR-mode, against the
        built proof target. You have a 5-scenario proof spec at e2e/reports.spec.ts, a committed e2e/playwright.proof.config.ts,
        the project's own e2e/playwright.config.ts, an effective viewport verdict of `pinned:1600x900`,
        and the preview server answering at http://127.0.0.1:41453. The audit run has already passed;
        its summary reports `phases.hermetic` clean with no undeclared live calls, and `phases.har_bind.out`
        of `.pw-prove/reports.api.har`. Give the exact command for the filming run.
